spring.application.name=goup

spring.datasource.url=jdbc:mysql://localhost:3306/goup_events?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.open-in-view=false

spring.jackson.time-zone=America/Sao_Paulo
server.port=8080

goup.jwt.secret=${GOUP_JWT_SECRET}
goup.jwt.expiration-ms=900000
# Google Places (API New) - usado para Location e locais proximos
goup.google.places.api-key=${GOOGLE_PLACES_API_KEY:}
goup.google.places.nearby-radius-meters=1500
goup.google.places.nearby-types=restaurant,cafe,bar,bakery,tourist_attraction,park

# Gemini - Descoberta Magica
goup.gemini.api-key=${GEMINI_API_KEY:}
goup.gemini.model=gemini-2.5-flash
goup.discovery.candidate-limit=20

# Planos: Free (users.premium = false) e Premium (users.premium = true)
goup.plans.free.nearby-limit=3
goup.plans.premium.nearby-limit=10
